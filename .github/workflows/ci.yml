name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy src/slopseal
      - name: Console script exists
        run: |
          # The entry point is reserved in Phase 0. The stub exits 1, so this asserts
          # the command is installed (a missing command exits 127) and still fails closed.
          # TODO(Phase 1): replace with a real smoke test, for example `slopseal --help` exits 0.
          code=0
          slopseal --help || code=$?
          [ "$code" -eq 1 ]
      - name: Tests
        run: |
          # TODO(Phase 1): remove the `|| [ $? -eq 5 ]` tolerance as soon as the first test
          # lands. pytest exits 5 when no tests are collected, which is only acceptable while
          # src/tests is empty. Leaving it in would let a broken collection pass silently.
          pytest || [ $? -eq 5 ]
