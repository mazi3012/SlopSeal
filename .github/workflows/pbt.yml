name: pbt

# Runs the property suite when the trust policy, the specs, or the code change.
# A failure here means a fail-closed property was violated. Do not weaken the test.
on:
  push:
    branches: [main]
    paths:
      - ".kiro/steering/dependency-trust.md"
      - ".kiro/specs/seal/properties.md"
      - "src/**"
  pull_request:
    paths:
      - ".kiro/steering/dependency-trust.md"
      - ".kiro/specs/seal/properties.md"
      - "src/**"

permissions:
  contents: read

jobs:
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Property suite
        env:
          SLOPSEAL_PBT_EXAMPLES: "500"
        run: |
          # Runs every test in the property suite. No marker filter: the tests do not carry
          # the `property` marker, so `-m property` selected zero tests and exit 5 was silently
          # tolerated. Exit 5 is no longer tolerated.
          pytest src/tests/properties -q
