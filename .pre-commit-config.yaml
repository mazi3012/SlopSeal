# Install once with: pre-commit install
# Local hooks use the tools from `pip install -e ".[dev]"`, so versions match CI.
#
# The policy guard (policy-checks below) runs when the trust policy or its floors
# change. It calls src/slopseal/policy/loader.py, the only implementation of the fence
# rule, then runs the property suite. See PRD.md, Open Decision 8.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy src/slopseal
        language: system
        types: [python]
        pass_filenames: false
      # Policy guard: runs when the trust policy, its loader, its floors, or the property
      # suite change. Rejects a weakening edit (R-PBT-2). Same script as the Kiro hook.
      - id: policy-checks
        name: policy guard and property suite
        entry: bash scripts/policy_checks.sh
        language: system
        pass_filenames: false
        always_run: false
        files: '^(\.kiro/steering/dependency-trust\.md|\.kiro/specs/seal/properties\.md|src/slopseal/policy/.*\.py|src/tests/properties/.*\.py|scripts/policy_.*)$'
